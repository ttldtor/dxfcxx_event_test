# FEED control for comparing release stacks without explicit notification aggregation.
# Keep this workload aligned with aggregation-stream-control.conf so FEED
# supersession can also be compared with the non-conflating STREAM_FEED result.
EXPERIMENT_TITLE=FEED release-stack comparison
EXPERIMENT_OBJECTIVE=Check for delivery, supersession, latency, or resource regression between selected CXX API release stacks.
EXPERIMENT_VARIABLE=Complete release stack: CXX API, Graal Native SDK, and embedded QD dependency.
EXPERIMENT_CONTROLS=Compiler, host, FEED role, shuffled 375-symbol workload, 150,000 recurring events/s, zero aggregation, warm-up, and duration.
EXPERIMENT_SUCCESS_CRITERIA=Compare listener coverage and deficit, per-type latency, callback shape, QD drops, buffers, I/O rates, and CPU across three repetitions.
EXPERIMENT_LIMITATIONS=Cannot attribute differences to one stack component or compare the legacy C API, which lacks TextMessage and has one-event, non-conflating client delivery semantics.
REPETITIONS=3
WARMUP=30s
DURATION=1m
WINDOW=10s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=30s
MONITORING_PERIOD=10s
CLIENT_ROLE=feed
LISTENER_DELAY=0
EVENTS_BATCH_LIMIT=optimal
AGGREGATION_PERIOD=0
COOLDOWN_SECONDS=10
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

# PROFILE=name|task|client-role|events-batch-limit|aggregation-period
PROFILE=sdk-feed-0|SUB:Q375;T375;E375;S375@10ms#375~22805|feed|optimal|0
