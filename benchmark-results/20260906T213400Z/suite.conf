# Controlled TimeAndSale HISTORY snapshot-to-live experiment.
EXPERIMENT_TITLE=TimeAndSale snapshot-to-live benchmark
EXPERIMENT_OBJECTIVE=Measure initial HISTORY snapshot delivery and the transition to live TimeAndSale while ticker-like events continue.
EXPERIMENT_VARIABLE=Initial TimeAndSale snapshot followed by a steady live TimeAndSale stream.
EXPERIMENT_CONTROLS=Compiler, host, FEED role, 300 shared symbols, nominal 150,000 recurring events/s, zero aggregation, warm-up, duration, and monitoring period.
EXPERIMENT_SUCCESS_CRITERIA=Verify snapshot completion without duplicates or premature live events, then compare live TimeAndSale latency, ticker latency, QD drops, CPU, and RSS across repetitions.
EXPERIMENT_LIMITATIONS=Synthetic loopback traffic and in-process bounded history do not reproduce production multiplexer retention, network conditions, or legacy C API delivery.
REPETITIONS=3
WARMUP=30s
DURATION=1m
WINDOW=10s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=30s
MONITORING_PERIOD=10s
TIME_SERIES_PREFILL=2s
TIME_SERIES_HISTORY=1000
CLIENT_ROLE=feed
LISTENER_DELAY=0
EVENTS_BATCH_LIMIT=optimal
AGGREGATION_PERIOD=0
COOLDOWN_SECONDS=10
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

# PROFILE=name|task|client-role|events-batch-limit|aggregation-period
# 300 events of each type every 10 ms = 150,000 recurring events/s in total.
# Q/T/E/S share the regular subscription; N uses a separate TimeAndSale time-series subscription.
PROFILE=time-series-snapshot|SUB:Q300;T300;E300;S300;N300@10ms#300~22805|feed|optimal|0
