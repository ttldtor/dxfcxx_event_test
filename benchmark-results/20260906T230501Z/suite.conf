# Controlled TimeAndSale HISTORY cardinality/depth scaling experiment for the v8 release stack.
EXPERIMENT_TITLE=TimeAndSale HISTORY cardinality and depth scaling
EXPERIMENT_OBJECTIVE=Measure how a completed bounded TimeAndSale snapshot affects steady-state ticker latency, live TimeAndSale latency, and client memory.
EXPERIMENT_VARIABLE=Subscribed symbol cardinality at depth 200, followed by retained history depth at 375 symbols.
EXPERIMENT_CONTROLS=CXX API v8 stack, FEED role, Q/T/E/S/N quantities, 10 ms cadence, 10.5 s prefill, zero aggregation, warm-up, duration, and loopback transport.
EXPERIMENT_SUCCESS_CRITERIA=Complete every requested snapshot without duplicate indices or premature live events; compare snapshot size and duration, ticker and TimeAndSale latency, QD drops, CPU, and RSS.
EXPERIMENT_LIMITATIONS=The symbol sweep also changes the common Q/T/E/S subscription universe; synthetic loopback traffic and bounded in-process history do not reproduce production multiplexer retention or network conditions.
REPETITIONS=3
WARMUP=15s
DURATION=30s
WINDOW=10s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=60s
MONITORING_PERIOD=5s
TIME_SERIES_PREFILL=10500ms
TIME_SERIES_HISTORY=200
CLIENT_ROLE=feed
LISTENER_DELAY=0
EVENTS_BATCH_LIMIT=optimal
AGGREGATION_PERIOD=0
COOLDOWN_SECONDS=8
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

# PROFILE=name|task|client-role|events-batch-limit|aggregation-period|client-implementation|time-series-prefill|time-series-history
# Q/T/E/S contribute a fixed 150,000 events/s; N contributes another fixed 37,500 events/s.
# The common prefill fills every cap while keeping the effective JVM/QD warm-up time comparable.
PROFILE=tns-symbols-375-h200|SUB:Q375;T375;E375;S375;N375@10ms#375~22805|feed|optimal|0|graal|10500ms|200
PROFILE=tns-symbols-750-h200|SUB:Q375;T375;E375;S375;N375@10ms#750~22805|feed|optimal|0|graal|10500ms|200
PROFILE=tns-symbols-1500-h200|SUB:Q375;T375;E375;S375;N375@10ms#1500~22805|feed|optimal|0|graal|10500ms|200

# Depth sweep: 375 symbols remain fixed while the retained events per symbol change.
PROFILE=tns-symbols-375-h100|SUB:Q375;T375;E375;S375;N375@10ms#375~22805|feed|optimal|0|graal|10500ms|100
PROFILE=tns-symbols-375-h1000|SUB:Q375;T375;E375;S375;N375@10ms#375~22805|feed|optimal|0|graal|10500ms|1000
