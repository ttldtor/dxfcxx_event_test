# Locates the approximate delivery-capacity knee before a repeated confirmation run.
EXPERIMENT_TITLE=Graal CXX and legacy C API capacity discovery
EXPERIMENT_OBJECTIVE=Locate the recurring event rate at which each client delivery path first stops keeping pace with the same synthetic publisher.
EXPERIMENT_VARIABLE=Client delivery semantics and publication rate: Graal CXX STREAM_FEED, Graal CXX FEED, and the default legacy C API contract at 150,000 through 500,000 events/s.
EXPERIMENT_CONTROLS=Host, compiler, synthetic server, 375-symbol shuffled Q/T/E/S workload, 1,500 events per publication, zero Graal aggregation, warm-up, duration, and monitoring period.
EXPERIMENT_SUCCESS_CRITERIA=Identify the first rate with reduced delivery coverage or throughput while verifying publisher target rate, skipped deadlines, QD drops, buffers, CPU, and RSS.
EXPERIMENT_LIMITATIONS=This single-repetition discovery suite is not a statistical comparison; FEED may supersede intermediate ticker states by design, and legacy events have no common benchmark publish timestamp for E2E latency comparison.
REPETITIONS=1
WARMUP=10s
DURATION=20s
WINDOW=5s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=30s
MONITORING_PERIOD=5s
CLIENT_ROLE=stream-feed
LISTENER_DELAY=0
EVENTS_BATCH_LIMIT=optimal
AGGREGATION_PERIOD=0
COOLDOWN_SECONDS=2
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

# PROFILE=name|task|client-role|events-batch-limit|aggregation-period|client-implementation
# Every profile publishes the same 1,500-event batch. Only its cadence changes.
PROFILE=150k-graal-stream|SUB:Q375;T375;E375;S375@10ms#375~22805|stream-feed|optimal|0|graal
PROFILE=150k-graal-feed|SUB:Q375;T375;E375;S375@10ms#375~22805|feed|optimal|0|graal
PROFILE=150k-legacy-default|SUB:Q375;T375;E375;S375@10ms#375~22805||||legacy
