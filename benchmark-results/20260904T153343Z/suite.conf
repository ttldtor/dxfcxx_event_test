# Shared by run-benchmark.ps1 and run-benchmark.sh.
REPETITIONS=3
WARMUP=1m
DURATION=10m
WINDOW=10s
BATCH_TIMEOUT=30s
MONITORING_PERIOD=10s
COOLDOWN_SECONDS=30
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

# The first three profiles compare cadence at the same 150,000 event/s rate.
# The 1 ms profile is a scheduler/publisher stress case and should be interpreted separately.
PROFILE=150k-1s|SUB:Q50000;T50000;S50000@1s
PROFILE=150k-100ms|SUB:Q5000;T5000;S5000@100ms
PROFILE=150k-10ms|SUB:Q500;T500;S500@10ms
PROFILE=150k-1ms-stress|SUB:Q50;T50;S50@1ms
