# Applies three source-time selection methods to the same synthetic Trade/TradeETH callbacks.
EXPERIMENT_TITLE=Customer source-time methodology control
EXPERIMENT_OBJECTIVE=Quantify how a single global strictly increasing Trade timestamp changes sample count and reported latency relative to all observations and an instrument-aware filter.
EXPERIMENT_VARIABLE=Endpoint role and native callback batch limit: FEED optimal, FEED one event, and STREAM_FEED optimal.
EXPERIMENT_CONTROLS=Host, CXX API v8.0.0, synthetic server, 375 symbols, 150,000 Q/T/E/S events/s, Trade timestamps, shuffled publication order, warm-up, duration, and monitoring period.
EXPERIMENT_SUCCESS_CRITERIA=Report acceptance ratios and latency distributions for all Trade/TradeETH observations, strict monotonicity per event-kind and symbol, and the customer's single global strict timestamp filter.
EXPERIMENT_LIMITATIONS=The source is synthetic loopback rather than recorded OPRA traffic; it does not reproduce production network or server stalls; the customer's eligibility-time gates and 10-second terminal histogram bin are not modeled because the runner already defines the measurement interval and preserves uncapped latency statistics.
REPETITIONS=3
WARMUP=15s
DURATION=30s
WINDOW=5s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=2m
MONITORING_PERIOD=5s
CLIENT_ROLE=feed
LISTENER_DELAY=0
EVENTS_BATCH_LIMIT=optimal
AGGREGATION_PERIOD=0
COOLDOWN_SECONDS=3
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

# PROFILE=name|task|client-role|events-batch-limit|aggregation-period|client-implementation
PROFILE=feed-optimal|SUB:Q375;T375;E375;S375@10ms~22805|feed|optimal|0|graal
PROFILE=feed-batch-1|SUB:Q375;T375;E375;S375@10ms~22805|feed|1|0|graal
PROFILE=stream-control|SUB:Q375;T375;E375;S375@10ms~22805|stream-feed|optimal|0|graal
