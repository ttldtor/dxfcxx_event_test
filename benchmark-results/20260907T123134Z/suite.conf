# Separates C++ listener/reporting overhead from API and transport delivery at the confirmed source-capacity points.
EXPERIMENT_TITLE=Marker-correlated and delivery-only API overhead comparison
EXPERIMENT_OBJECTIVE=Determine how much of the observed client CPU, RSS, and delivery behavior belongs to benchmark timestamp correlation rather than the Graal CXX or legacy API delivery path.
EXPERIMENT_VARIABLE=Client callback work at 150,000, 375,000, and 500,000 nominal events/s: full Graal marker correlation, Graal STREAM_FEED delivery-only counters, and legacy default delivery-only counters.
EXPERIMENT_CONTROLS=Host, compiler, synthetic server, 375-symbol shuffled Q/T/E/S workload, 1,500 events per publication, warm-up, duration, monitoring period, and rotating run order.
EXPERIMENT_SUCCESS_CRITERIA=Compare observed delivery rate, callback shape, QD drops, CPU, and RSS while retaining Graal E2E latency as a separate full-client result.
EXPERIMENT_LIMITATIONS=The synthetic publisher approaches its own capacity at 500,000 nominal events/s; the legacy callback API delivers one event at a time; the full and delivery-only reports expose different observables; this fixed independent event mix is not a causal market-microstructure model.
REPETITIONS=3
WARMUP=15s
DURATION=30s
WINDOW=5s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=30s
MONITORING_PERIOD=5s
CLIENT_ROLE=stream-feed
LISTENER_DELAY=0
EVENTS_BATCH_LIMIT=optimal
AGGREGATION_PERIOD=0
COOLDOWN_SECONDS=3
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

# PROFILE=name|task|client-role|events-batch-limit|aggregation-period|client-implementation
PROFILE=150k-graal-full|SUB:Q375;T375;E375;S375@10ms#375~22805|stream-feed|optimal|0|graal
