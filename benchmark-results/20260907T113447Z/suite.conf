# Confirms the baseline, pre-knee, and publisher-knee points selected by api-capacity-discovery.conf.
EXPERIMENT_TITLE=Graal CXX and legacy C API capacity confirmation
EXPERIMENT_OBJECTIVE=Confirm whether either non-conflating client delivery path stops keeping pace before the current synthetic publisher reaches its capacity knee.
EXPERIMENT_VARIABLE=Client delivery semantics and publication rate: Graal CXX STREAM_FEED, Graal CXX FEED, and the default legacy C API contract at 150,000, 375,000, and 500,000 nominal events/s.
EXPERIMENT_CONTROLS=Host, compiler, synthetic server, 375-symbol shuffled Q/T/E/S workload, 1,500 events per publication, zero Graal aggregation, warm-up, duration, monitoring period, and rotating run order.
EXPERIMENT_SUCCESS_CRITERIA=Repeat delivery coverage, throughput, latency, QD drops, buffers, CPU, and RSS while distinguishing a client limit from missed publisher deadlines.
EXPERIMENT_LIMITATIONS=The current publisher already falls below its nominal 500,000-event/s target; FEED may supersede intermediate ticker states by design; legacy events have no common benchmark publish timestamp; client listener work is not identical.
REPETITIONS=3
WARMUP=15s
DURATION=30s
WINDOW=5s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=30s
MONITORING_PERIOD=5s
CLIENT_ROLE=stream-feed
LISTENER_DELAY=0
EVENTS_BATCH_LIMIT=optimal
AGGREGATION_PERIOD=0
COOLDOWN_SECONDS=3
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

# PROFILE=name|task|client-role|events-batch-limit|aggregation-period|client-implementation
PROFILE=150k-graal-stream|SUB:Q375;T375;E375;S375@10ms#375~22805|stream-feed|optimal|0|graal
PROFILE=150k-graal-feed|SUB:Q375;T375;E375;S375@10ms#375~22805|feed|optimal|0|graal
