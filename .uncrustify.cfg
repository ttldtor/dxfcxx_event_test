# Uncrustify supplements clang-format with statement-level blank-line rules.
# Keep every unrelated option at its default so clang-format remains the primary formatter.

nl_before_return = true

nl_before_if = force
nl_after_if = force
nl_before_for = force
nl_after_for = force
nl_before_while = force
nl_after_while = force
nl_before_switch = force
nl_after_switch = force
nl_before_do = force
nl_after_do = force

nl_max = 2
