# Compares listener delivery shape in the Graal CXX API and legacy C API processes.
EXPERIMENT_TITLE=Graal CXX API and legacy C API delivery comparison
EXPERIMENT_OBJECTIVE=Compare observable listener delivery rate and callback shape while keeping the synthetic composite-event workload constant.
EXPERIMENT_VARIABLE=Client implementation and its normal delivery semantics: Graal CXX STREAM_FEED versus the default legacy C API contract.
EXPERIMENT_CONTROLS=Host, compiler, synthetic server, shuffled four-type workload, 150,000 recurring composite events/s, warm-up, duration, and monitoring period.
EXPERIMENT_SUCCESS_CRITERIA=Record per-run recurring event rate, callback count, maximum callback batch size, per-type counts, QD monitoring, and Graal-client E2E latency.
EXPERIMENT_LIMITATIONS=Legacy events have no common benchmark publish timestamp, regional subscriptions do not create regional publications, and callback delivery rate is not an E2E latency measurement.
REPETITIONS=3
WARMUP=30s
DURATION=1m
WINDOW=10s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=30s
MONITORING_PERIOD=10s
CLIENT_ROLE=stream-feed
LISTENER_DELAY=0
EVENTS_BATCH_LIMIT=optimal
AGGREGATION_PERIOD=0
COOLDOWN_SECONDS=10
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

# PROFILE=name|task|client-role|events-batch-limit|aggregation-period|client-implementation
PROFILE=graal-stream|SUB:Q375;T375;E375;S375@10ms#375~22805|stream-feed|optimal|0|graal
PROFILE=legacy-default|SUB:Q375;T375;E375;S375@10ms#375~22805||||legacy
