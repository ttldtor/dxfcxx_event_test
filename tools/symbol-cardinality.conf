# Compare subscription cardinality at a constant 150,000 recurring events/s.
EXPERIMENT_TITLE=Subscribed-symbol cardinality comparison
EXPERIMENT_OBJECTIVE=Determine how a larger subscribed symbol universe affects FEED listener coverage and latency without increasing recurring event throughput.
EXPERIMENT_VARIABLE=Subscribed and retained symbol cardinality: 375, 3,750, or 10,000 symbols.
EXPERIMENT_CONTROLS=Compiler, host, FEED role, 1,500 recurring events per 10 ms publication, event-type mix, warm-up, duration, and monitoring period.
EXPERIMENT_SUCCESS_CRITERIA=Compare listener coverage and deficit, latency, callback shape, QD storage, drops, buffers, I/O rates, and CPU.
EXPERIMENT_LIMITATIONS=Only 375 symbols tick in each publication; the experiment models subscription state separately from the customer's unknown active-symbol distribution.
REPETITIONS=3
WARMUP=30s
DURATION=2m
WINDOW=10s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=1m
MONITORING_PERIOD=10s
CLIENT_ROLE=feed
COOLDOWN_SECONDS=10
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

PROFILE=150k-375-symbols|SUB:Q375;T375;E375;S375@10ms#375
PROFILE=150k-3750-symbols|SUB:Q375;T375;E375;S375@10ms#3750
PROFILE=150k-10000-symbols|SUB:Q375;T375;E375;S375@10ms#10000
