# FEED control for comparing release stacks without explicit notification aggregation.
# Keep this workload aligned with aggregation-stream-control.conf so FEED
# supersession can also be compared with the non-conflating STREAM_FEED result.
REPETITIONS=3
WARMUP=30s
DURATION=1m
WINDOW=10s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=30s
MONITORING_PERIOD=10s
CLIENT_ROLE=feed
LISTENER_DELAY=0
EVENTS_BATCH_LIMIT=optimal
AGGREGATION_PERIOD=0
COOLDOWN_SECONDS=10
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

# PROFILE=name|task|client-role|events-batch-limit|aggregation-period
PROFILE=sdk-feed-0|SUB:Q375;T375;E375;S375@10ms#375~22805|feed|optimal|0
