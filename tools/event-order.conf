# Test whether FEED listener deficit follows an event type or its position in the publication.
REPETITIONS=3
WARMUP=30s
DURATION=1m
WINDOW=10s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=30s
MONITORING_PERIOD=10s
CLIENT_ROLE=feed
COOLDOWN_SECONDS=10
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

# Each profile publishes the same 375 events of every type every 10 ms. Only block order changes.
PROFILE=order-summary-last|SUB:Q375;T375;E375;S375@10ms#375
PROFILE=order-quote-last|SUB:T375;E375;S375;Q375@10ms#375
PROFILE=order-trade-last|SUB:E375;S375;Q375;T375@10ms#375
PROFILE=order-trade-eth-last|SUB:S375;Q375;T375;E375@10ms#375
