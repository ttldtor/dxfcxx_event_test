# Test whether FEED listener deficit follows an event type or its position in the publication.
EXPERIMENT_TITLE=Event-type publication-order comparison
EXPERIMENT_OBJECTIVE=Determine whether FEED listener deficit follows a particular event type or the type's position in each publication.
EXPERIMENT_VARIABLE=Order of the Quote, Trade, TradeETH, and Summary blocks, with a different type placed last in each profile.
EXPERIMENT_CONTROLS=Compiler, host, FEED role, 375 events of each type per publication, 10 ms cadence, symbol universe, warm-up, and duration.
EXPERIMENT_SUCCESS_CRITERIA=Compare per-type and total listener deficit, callback shape, latency, QD drops, buffers, I/O rates, and CPU.
EXPERIMENT_LIMITATIONS=Block ordering is synthetic and the result cannot identify the internal supersession stage or represent TimeAndSale history delivery.
REPETITIONS=3
WARMUP=30s
DURATION=1m
WINDOW=10s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=30s
MONITORING_PERIOD=10s
CLIENT_ROLE=feed
COOLDOWN_SECONDS=10
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

# Each profile publishes the same 375 events of every type every 10 ms. Only block order changes.
PROFILE=order-summary-last|SUB:Q375;T375;E375;S375@10ms#375
PROFILE=order-quote-last|SUB:T375;E375;S375;Q375@10ms#375
PROFILE=order-trade-last|SUB:E375;S375;Q375;T375@10ms#375
PROFILE=order-trade-eth-last|SUB:S375;Q375;T375;E375@10ms#375
