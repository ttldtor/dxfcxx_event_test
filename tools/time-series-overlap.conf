# Adds TimeAndSale HISTORY while a fixed ticker workload is already being measured.
EXPERIMENT_TITLE=Transient ticker interference during TimeAndSale HISTORY delivery
EXPERIMENT_OBJECTIVE=Determine whether adding a TimeAndSale HISTORY subscription temporarily increases ticker listener latency, delivery deficit, CPU, or RSS.
EXPERIMENT_VARIABLE=Retained TimeAndSale history depth delivered during an already-running ticker measurement.
EXPERIMENT_CONTROLS=CXX API v8 stack, 375 subscribed and active symbols, fixed Q/T/E/S/N quantities, 10 ms cadence, FEED role, zero aggregation, loopback transport, warm-up, measurement phases, and publication order seed.
EXPERIMENT_SUCCESS_CRITERIA=Complete every snapshot with QD Dropped zero and compare marker-correlated ticker latency, listener coverage, CPU, and RSS before, during, and after snapshot delivery.
EXPERIMENT_LIMITATIONS=The synthetic in-process server and loopback transport do not reproduce production multiplexer retention or network conditions; the snapshot phase is short and resource sampling can contain few observations; phase correlation counters can straddle exact boundaries.
REPETITIONS=3
WARMUP=15s
DURATION=40s
WINDOW=10s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=60s
MONITORING_PERIOD=5s
TIME_SERIES_PREFILL=10500ms
TIME_SERIES_HISTORY=200
TIME_SERIES_SUBSCRIBE_AFTER=10s
CLIENT_ROLE=feed
LISTENER_DELAY=0
EVENTS_BATCH_LIMIT=optimal
AGGREGATION_PERIOD=0
COOLDOWN_SECONDS=8
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

# PROFILE=name|task|client-role|events-batch-limit|aggregation-period|client-implementation|time-series-prefill|time-series-history|time-series-subscribe-after
# Every profile keeps the same 375-symbol recurring workload and nominal 187,500 events/s.
PROFILE=tns-overlap-h100|SUB:Q375;T375;E375;S375;N375@10ms#375~22805|feed|optimal|0|graal|10500ms|100
PROFILE=tns-overlap-h200|SUB:Q375;T375;E375;S375;N375@10ms#375~22805|feed|optimal|0|graal|10500ms|200
PROFILE=tns-overlap-h1000|SUB:Q375;T375;E375;S375;N375@10ms#375~22805|feed|optimal|0|graal|10500ms|1000
