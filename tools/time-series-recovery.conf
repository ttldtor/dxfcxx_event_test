# Adds TimeAndSale HISTORY during ticker measurement, then removes it at global snapshot completion.
EXPERIMENT_TITLE=Matched ticker recovery after TimeAndSale HISTORY delivery
EXPERIMENT_OBJECTIVE=Determine whether ticker latency returns to its pre-snapshot baseline after a transient TimeAndSale HISTORY subscription is removed.
EXPERIMENT_VARIABLE=Retained TimeAndSale history depth delivered and removed during an already-running ticker measurement.
EXPERIMENT_CONTROLS=CXX API v8 stack, 375 subscribed and active symbols, fixed Q/T/E/S load of 150000 events/s before and after the snapshot, 10 ms cadence, FEED role, zero aggregation, loopback transport, warm-up, measurement phases, and publication order seed.
EXPERIMENT_SUCCESS_CRITERIA=Complete every snapshot with QD Dropped zero; verify that marker-correlated ticker latency and resource use rise during delivery and recover toward the matched Q/T/E/S pre-snapshot baseline after TimeAndSale removal.
EXPERIMENT_LIMITATIONS=The synthetic in-process server and loopback transport do not reproduce production multiplexer retention or network conditions; subscription removal is asynchronous; the snapshot phase is short and resource sampling can contain few observations; phase correlation counters can straddle exact boundaries.
REPETITIONS=3
WARMUP=15s
DURATION=40s
WINDOW=10s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=60s
MONITORING_PERIOD=5s
TIME_SERIES_PREFILL=10500ms
TIME_SERIES_HISTORY=200
TIME_SERIES_SUBSCRIBE_AFTER=10s
TIME_SERIES_UNSUBSCRIBE_AFTER_SNAPSHOT=true
CLIENT_ROLE=feed
LISTENER_DELAY=0
EVENTS_BATCH_LIMIT=optimal
AGGREGATION_PERIOD=0
COOLDOWN_SECONDS=8
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

# PROFILE=name|task|client-role|events-batch-limit|aggregation-period|client-implementation|time-series-prefill|time-series-history|time-series-subscribe-after
# Q/T/E/S remain subscribed for the whole run at 150,000 events/s. TimeAndSale adds 37,500 events/s only while its
# delayed HISTORY subscription is active and is removed at global snapshot completion.
PROFILE=tns-recovery-h100|SUB:Q375;T375;E375;S375;N375@10ms#375~22805|feed|optimal|0|graal|10500ms|100
PROFILE=tns-recovery-h200|SUB:Q375;T375;E375;S375;N375@10ms#375~22805|feed|optimal|0|graal|10500ms|200
PROFILE=tns-recovery-h1000|SUB:Q375;T375;E375;S375;N375@10ms#375~22805|feed|optimal|0|graal|10500ms|1000
