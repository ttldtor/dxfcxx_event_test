# Shared by run-benchmark.ps1 and run-benchmark.sh.
REPETITIONS=3
WARMUP=1m
DURATION=10m
WINDOW=10s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=30s
MONITORING_PERIOD=10s
CLIENT_ROLE=feed
COOLDOWN_SECONDS=30
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

# The first three profiles compare cadence at the same 150,000 event/s rate.
# The 1 ms profile is a scheduler/publisher stress case and should be interpreted separately.
PROFILE=150k-1s|SUB:Q37500;T37500;E37500;S37500@1s
PROFILE=150k-100ms|SUB:Q3750;T3750;E3750;S3750@100ms
PROFILE=150k-10ms|SUB:Q375;T375;E375;S375@10ms
PROFILE=150k-1ms-stress|SUB:Q38;T38;E37;S37@1ms
