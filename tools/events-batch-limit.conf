# Locates FEED supersession relative to native notification batching.
EXPERIMENT_TITLE=Native event-notification batch-limit comparison
EXPERIMENT_OBJECTIVE=Determine how the C++ event-notification batch limit affects FEED listener coverage, callback cost, and latency.
EXPERIMENT_VARIABLE=Native notification batch limit: optimal, 1, 375, 1,500, or maximum; STREAM_FEED optimal is the delivery control.
EXPERIMENT_CONTROLS=Compiler, host, shuffled 375-symbol workload, 150,000 recurring events/s, cadence, warm-up, duration, and aggregation period.
EXPERIMENT_SUCCESS_CRITERIA=Compare listener coverage and deficit, callback size and duration, latency, connector I/O, QD drops, buffers, and CPU.
EXPERIMENT_LIMITATIONS=The limit-one profile intentionally adds callback overhead and the experiment cannot locate every undelayed FEED supersession.
REPETITIONS=3
WARMUP=30s
DURATION=1m
WINDOW=10s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=30s
MONITORING_PERIOD=10s
CLIENT_ROLE=feed
EVENTS_BATCH_LIMIT=optimal
COOLDOWN_SECONDS=10
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

# PROFILE=name|task|client-role|events-batch-limit|aggregation-period
# Limit 1 is intentionally a callback-overhead stress control.
PROFILE=batch-optimal|SUB:Q375;T375;E375;S375@10ms#375~22805|feed|optimal
PROFILE=batch-1-stress|SUB:Q375;T375;E375;S375@10ms#375~22805|feed|1
PROFILE=batch-375|SUB:Q375;T375;E375;S375@10ms#375~22805|feed|375
PROFILE=batch-1500|SUB:Q375;T375;E375;S375@10ms#375~22805|feed|1500
PROFILE=batch-maximum|SUB:Q375;T375;E375;S375@10ms#375~22805|feed|maximum
PROFILE=stream-control|SUB:Q375;T375;E375;S375@10ms#375~22805|stream-feed|optimal
