# Isolates active composite/regional record-key fan-out while holding aggregate publication rate constant.
EXPERIMENT_TITLE=Active regional-symbol fan-out comparison
EXPERIMENT_OBJECTIVE=Determine whether active regional record keys reduce listener delivery throughput or increase latency while aggregate event rate remains fixed.
EXPERIMENT_VARIABLE=Zero, one, four, or twenty-six active regional sources for both Graal STREAM_FEED and default legacy C API clients.
EXPERIMENT_CONTROLS=Host, compiler, four event types, 375 base instruments, 1,500 recurring events per 10 ms, shuffled event-type order, warm-up, duration, and monitoring period.
EXPERIMENT_SUCCESS_CRITERIA=Compare Graal listener coverage and latency, legacy delivery rate and callback shape, server QD metrics, and client CPU and RSS where available.
EXPERIMENT_LIMITATIONS=The regional source selected for each base instrument is synthetic; the legacy API always expands base subscriptions to all 26 regional sources; there is no TimeAndSale or historical snapshot traffic; legacy delivery has no common E2E timestamp marker.
REPETITIONS=3
WARMUP=30s
DURATION=1m
WINDOW=10s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=30s
MONITORING_PERIOD=10s
CLIENT_ROLE=stream-feed
LISTENER_DELAY=0
EVENTS_BATCH_LIMIT=optimal
AGGREGATION_PERIOD=0
COOLDOWN_SECONDS=10
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

# PROFILE=name|task|client-role|events-batch-limit|aggregation-period|client-implementation
