# STREAM_FEED controls for the per-subscription aggregation-period experiment.
# The three profiles preserve the delivery contract while changing only the
# notification aggregation period.
REPETITIONS=3
WARMUP=30s
DURATION=1m
WINDOW=10s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=30s
MONITORING_PERIOD=10s
CLIENT_ROLE=stream-feed
LISTENER_DELAY=0
EVENTS_BATCH_LIMIT=optimal
AGGREGATION_PERIOD=0
COOLDOWN_SECONDS=10
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

# PROFILE=name|task|client-role|events-batch-limit|aggregation-period
# All profiles use the same shuffled 375-symbol, 150k recurring-events/s workload.
PROFILE=aggregation-stream-0|SUB:Q375;T375;E375;S375@10ms#375~22805|stream-feed|optimal|0
PROFILE=aggregation-stream-1ms|SUB:Q375;T375;E375;S375@10ms#375~22805|stream-feed|optimal|1ms
PROFILE=aggregation-stream-10ms|SUB:Q375;T375;E375;S375@10ms#375~22805|stream-feed|optimal|10ms
