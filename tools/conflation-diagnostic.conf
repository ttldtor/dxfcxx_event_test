# Short A/B suite for comparing FEED listener coverage with STREAM_FEED preservation.
EXPERIMENT_TITLE=FEED conflation diagnostic
EXPERIMENT_OBJECTIVE=Determine whether listener deficit is consistent with normal FEED supersession rather than transport loss or counted QD drops.
EXPERIMENT_VARIABLE=Endpoint role selected at invocation and, in the delayed control, artificial market-listener delay.
EXPERIMENT_CONTROLS=Compiler, host, 375-symbol workload, 150,000 recurring events/s, cadence, warm-up, duration, and monitoring period.
EXPERIMENT_SUCCESS_CRITERIA=Compare listener coverage with connector read and server write rates, QD drops, callback shape, latency, buffers, and CPU.
EXPERIMENT_LIMITATIONS=The undelayed control cannot by itself locate supersession on the publisher or client side and does not reproduce production topology.
REPETITIONS=3
WARMUP=30s
DURATION=2m
WINDOW=10s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=30s
MONITORING_PERIOD=10s
CLIENT_ROLE=feed
COOLDOWN_SECONDS=10
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

PROFILE=150k-10ms|SUB:Q375;T375;E375;S375@10ms
