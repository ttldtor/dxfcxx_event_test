# Compares the same delivery-only Graal client across separately configured CXX API release stacks.
EXPERIMENT_TITLE=Graal delivery-only release-stack control
EXPERIMENT_OBJECTIVE=Determine whether process delivery cost changed between pinned CXX API, Graal Native SDK, and QD release stacks without benchmark timestamp correlation.
EXPERIMENT_VARIABLE=The separately configured v5.0.0, v7.0.0, or v8.0.0 release stack used by both the synthetic server and the Graal delivery-only client.
EXPERIMENT_CONTROLS=Host, compiler, client callback code, STREAM_FEED role, 375-symbol shuffled Q/T/E/S workload, 1,500 events per publication, warm-up, duration, monitoring period, and rotating run order.
EXPERIMENT_SUCCESS_CRITERIA=Compare achieved delivery rate, callback shape, QD drops, CPU, and RSS at the confirmed baseline, pre-knee, and publisher-knee points.
EXPERIMENT_LIMITATIONS=Each stack also changes the server-side publisher and embedded QD version; the 500,000-events/s point approaches publisher capacity; the fixed independent event mix is not a causal market-microstructure model.
REPETITIONS=3
WARMUP=15s
DURATION=30s
WINDOW=5s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=30s
MONITORING_PERIOD=5s
CLIENT_ROLE=stream-feed
LISTENER_DELAY=0
EVENTS_BATCH_LIMIT=optimal
AGGREGATION_PERIOD=0
COOLDOWN_SECONDS=3
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

# PROFILE=name|task|client-role|events-batch-limit|aggregation-period|client-implementation
PROFILE=150k-graal-delivery|SUB:Q375;T375;E375;S375@10ms#375~22805|stream-feed|optimal|0|graal-delivery
PROFILE=375k-graal-delivery|SUB:Q375;T375;E375;S375@4ms#375~22805|stream-feed|optimal|0|graal-delivery
PROFILE=500k-graal-delivery|SUB:Q375;T375;E375;S375@3ms#375~22805|stream-feed|optimal|0|graal-delivery
