# Increases the mostly idle subscription universe while holding the active set and recurring throughput constant.
EXPERIMENT_TITLE=Inactive subscription-cardinality API comparison
EXPERIMENT_OBJECTIVE=Determine how a larger mostly idle symbol universe affects the Graal CXX and legacy C API delivery paths independently of active event throughput.
EXPERIMENT_VARIABLE=Subscribed base-symbol cardinality: 375, 3,750, or 10,000 symbols, with only the first 375 receiving recurring events.
EXPERIMENT_CONTROLS=Host, compiler, v8 synthetic server, 375 active base symbols, 150,000 composite Q/T/E/S events/s, shuffled publication order, warm-up, duration, monitoring period, and rotating run order.
EXPERIMENT_SUCCESS_CRITERIA=Compare startup completion, observed delivery rate, callback shape, QD subscription and storage state, drops, buffers, CPU, and RSS for Graal STREAM_FEED and legacy default clients.
EXPERIMENT_LIMITATIONS=This is not an E2E latency comparison; legacy 5.11 expands market subscriptions to composite and regional records internally; initial Profile state is delivered before measurement; the full production topology and customer's active-symbol distribution remain unknown.
REPETITIONS=3
WARMUP=15s
DURATION=30s
WINDOW=5s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=2m
MONITORING_PERIOD=5s
ACTIVE_SYMBOLS=375
CLIENT_ROLE=stream-feed
LISTENER_DELAY=0
EVENTS_BATCH_LIMIT=optimal
AGGREGATION_PERIOD=0
COOLDOWN_SECONDS=3
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

# PROFILE=name|task|client-role|events-batch-limit|aggregation-period|client-implementation
PROFILE=375-symbols-graal|SUB:Q375;T375;E375;S375@10ms#375~22805|stream-feed|optimal|0|graal-delivery
PROFILE=375-symbols-legacy|SUB:Q375;T375;E375;S375@10ms#375~22805||||legacy
PROFILE=3750-symbols-graal|SUB:Q375;T375;E375;S375@10ms#3750~22805|stream-feed|optimal|0|graal-delivery
PROFILE=3750-symbols-legacy|SUB:Q375;T375;E375;S375@10ms#3750~22805||||legacy
PROFILE=10000-symbols-graal|SUB:Q375;T375;E375;S375@10ms#10000~22805|stream-feed|optimal|0|graal-delivery
PROFILE=10000-symbols-legacy|SUB:Q375;T375;E375;S375@10ms#10000~22805||||legacy
