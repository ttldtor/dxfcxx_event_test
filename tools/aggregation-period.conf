# Short A/B suite for DXFeedSubscription aggregationPeriod.
EXPERIMENT_TITLE=FEED notification aggregation-period comparison
EXPERIMENT_OBJECTIVE=Determine how subscription notification aggregation changes FEED listener coverage, callback shape, and latency.
EXPERIMENT_VARIABLE=Market-event notification aggregation period of 0, 1 ms, or 10 ms; STREAM_FEED at 0 is the delivery-contract control.
EXPERIMENT_CONTROLS=Compiler, host, shuffled 375-symbol workload, 150,000 recurring events/s, event batch limit, warm-up, and duration.
EXPERIMENT_SUCCESS_CRITERIA=Compare listener coverage and deficit, callback shape, latency percentiles, QD drops, buffers, I/O rates, and CPU.
EXPERIMENT_LIMITATIONS=Cannot identify the exact internal supersession stage or represent production networking and TimeAndSale history traffic.
REPETITIONS=3
WARMUP=30s
DURATION=1m
WINDOW=10s
BATCH_TIMEOUT=30s
STARTUP_TIMEOUT=30s
MONITORING_PERIOD=10s
CLIENT_ROLE=feed
LISTENER_DELAY=0
EVENTS_BATCH_LIMIT=optimal
AGGREGATION_PERIOD=0
COOLDOWN_SECONDS=10
ADDRESS=127.0.0.1:7400
LISTEN_ADDRESS=:7400

# PROFILE=name|task|client-role|events-batch-limit|aggregation-period
# All profiles use the same 150,000 event/s workload and 375-symbol namespace.
PROFILE=aggregation-feed-0|SUB:Q375;T375;E375;S375@10ms#375~22805|feed|optimal|0
PROFILE=aggregation-feed-1ms|SUB:Q375;T375;E375;S375@10ms#375~22805|feed|optimal|1ms
PROFILE=aggregation-feed-10ms|SUB:Q375;T375;E375;S375@10ms#375~22805|feed|optimal|10ms
PROFILE=aggregation-stream-0|SUB:Q375;T375;E375;S375@10ms#375~22805|stream-feed|optimal|0
