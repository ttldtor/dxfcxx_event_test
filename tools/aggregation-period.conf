PROFILE=aggregation-feed-0|SUB:Q375;T375;E375;S375@10ms#375~22805|feed|optimal|0
PROFILE=aggregation-feed-1ms|SUB:Q375;T375;E375;S375@10ms#375~22805|feed|optimal|1ms
PROFILE=aggregation-feed-10ms|SUB:Q375;T375;E375;S375@10ms#375~22805|feed|optimal|10ms
PROFILE=aggregation-stream-0|SUB:Q375;T375;E375;S375@10ms#375~22805|stream-feed|optimal|0
