name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: Native / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-2022
          - name: Linux
            runner: ubuntu-24.04
            options: -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          - name: macOS ARM64
            runner: macos-15

    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DDXFCXX_BUILD_DOC=OFF
          -DDXFCXX_BUILD_SAMPLES=OFF
          -DDXFCXX_BUILD_TOOLS=OFF
          ${{ matrix.options }}
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  linux-container:
    name: Linux container / ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: latency-test:${{ strategy.job-index }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Smoke-test commands
        run: |
          docker run --rm latency-test:${{ strategy.job-index }} sh -ec '
            for binary in latency_server latency_client latency_analyzer; do
              dependencies="$(ldd "/opt/latency/bin/$binary")"
              printf "%s\n" "$dependencies"
              ! printf "%s\n" "$dependencies" | grep --fixed-strings --quiet "not found"
              printf "%s\n" "$dependencies" | grep --fixed-strings --quiet \
                "libstdc++.so.6 => /opt/gcc-runtime/libstdc++.so.6"
            done
          '
          docker run --rm latency-test:${{ strategy.job-index }} latency_server --help
          docker run --rm latency-test:${{ strategy.job-index }} latency_client --help
          docker run --rm latency-test:${{ strategy.job-index }} latency_analyzer --help

  linux-container-end-to-end:
    name: Linux container / end-to-end
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build --tag latency-test:ci .
      - name: Run server and client
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/latency-output"

          dump_diagnostics() {
            exit_code=$?
            if test "$exit_code" -eq 0; then
              return
            fi
            echo "::group::Latency server state"
            docker inspect latency-server || true
            echo "::endgroup::"
            echo "::group::Latency server log"
            docker logs latency-server 2>&1 || true
            echo "::endgroup::"
            if test -f "$RUNNER_TEMP/latency-output/smoke-client.log"; then
              echo "::group::Latency client log"
              cat "$RUNNER_TEMP/latency-output/smoke-client.log"
              echo "::endgroup::"
            fi
          }
          trap dump_diagnostics EXIT

          docker network create latency-test
          docker run --detach --name latency-server --network latency-test \
            latency-test:ci latency_server --address :7400 --monitoring-stat 1s

          server_ready=false
          for attempt in {1..30}; do
            if ! test "$(docker inspect --format '{{.State.Running}}' latency-server)" = true; then
              echo "Latency server exited before becoming ready"
              exit 1
            fi
            docker logs latency-server > "$RUNNER_TEMP/latency-server-startup.log" 2>&1
            if grep --fixed-strings --quiet "Latency server listening on" \
              "$RUNNER_TEMP/latency-server-startup.log"; then
              server_ready=true
              break
            fi
            sleep 1
          done
          test "$server_ready" = true

          docker run --rm --network latency-test \
            --mount "type=bind,source=$RUNNER_TEMP/latency-output,target=/work" \
            latency-test:ci latency_client --address latency-server:7400 \
              --task "SUB:Q10;S10;T10" --warmup 2s --duration 3s --window 1s \
              --batch-timeout 2s --monitoring-stat 1s --output smoke \
            2>&1 | tee "$RUNNER_TEMP/latency-output/smoke-client.log"
          docker logs latency-server > "$RUNNER_TEMP/latency-output/smoke-server.log" 2>&1
          echo "::group::Latency server log"
          cat "$RUNNER_TEMP/latency-output/smoke-server.log"
          echo "::endgroup::"
          docker run --rm \
            --mount "type=bind,source=$RUNNER_TEMP/latency-output,target=/work" \
            latency-test:ci latency_analyzer --run-directory /work --monitoring-period 1s \
            2>&1 | tee "$RUNNER_TEMP/latency-output/smoke-analyzer.log"

          for result in \
            smoke-client.log \
            smoke-server.log \
            smoke-analyzer.log \
            smoke-summary.csv \
            smoke-outliers.csv \
            monitoring.csv \
            monitoring-summary.csv; do
            test -s "$RUNNER_TEMP/latency-output/$result"
          done
      - name: Publish end-to-end results
        if: always()
        shell: bash
        env:
          RESULTS_DIR: ${{ runner.temp }}/latency-output
          TEST_STATUS: ${{ job.status }}
        run: |
          if docker inspect latency-server > /dev/null 2>&1; then
            mkdir -p "$RESULTS_DIR"
            docker logs latency-server > "$RESULTS_DIR/smoke-server.log" 2>&1 || true
          fi

          echo "::group::Generated end-to-end files"
          if test -d "$RESULTS_DIR"; then
            find "$RESULTS_DIR" -maxdepth 1 -type f -printf '%f\t%k KiB\n' | sort
          else
            echo "No result directory was created"
          fi
          echo "::endgroup::"

          for log in smoke-client.log smoke-server.log smoke-analyzer.log; do
            if test -s "$RESULTS_DIR/$log"; then
              echo "::group::$log"
              cat "$RESULTS_DIR/$log"
              echo "::endgroup::"
            fi
          done

          append_report() {
            title=$1
            report=$2
            language=$3
            echo "### $title" >> "$GITHUB_STEP_SUMMARY"
            if test -s "$report"; then
              printf '```%s\n' "$language" >> "$GITHUB_STEP_SUMMARY"
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              printf '```\n' >> "$GITHUB_STEP_SUMMARY"
            else
              echo '_Not produced._' >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          {
            echo '## Linux container end-to-end'
            echo
            echo "- Status: **$TEST_STATUS**"
            echo '- Task: `SUB:Q10;S10;T10`'
            echo '- Warm-up: `2s`; measurement: `3s`; window: `1s`'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          append_report 'Latency summary' "$RESULTS_DIR/smoke-summary.csv" csv
          append_report 'Monitoring summary' "$RESULTS_DIR/monitoring-summary.csv" csv
      - name: Upload end-to-end artifact
        if: always()
        id: e2e_artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-end-to-end-results
          path: ${{ runner.temp }}/latency-output
          if-no-files-found: warn
      - name: Add artifact link to summary
        if: always() && steps.e2e_artifact.outputs.artifact-url != ''
        shell: bash
        run: |
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "[Download complete end-to-end results](${{ steps.e2e_artifact.outputs.artifact-url }})" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Stop server
        if: always()
        run: |
          docker rm --force latency-server || true
          docker network rm latency-test || true
